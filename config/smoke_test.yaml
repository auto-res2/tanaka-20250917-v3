experiment_name: "radiance_smoke_test"

# Execution settings
seeds: [42]
batch_size: 2

# Model and Data settings
models: # Using SD-XL as a stand-in for DiT-XL/2 due to availability
  - "SD-XL"
datasets:
  train: "benjamin-paine/imagenet-1k-256x256"
  eval: "benjamin-paine/imagenet-1k-256x256"
adaptation_datasets:
  domain_shift:
    - "randall-lab/flowers102"

# RL Training settings
ppo_updates: 10
hyperparameters:
  lr: 0.0001
  ppo_clip: 0.2
  lambda_power: 0.5
  mu_risk: 50.0
  risk_threshold_fid: 0.015 # Looser for smoke test
  risk_threshold_lpips: 0.05

# Zeroth-Order Adaptation settings
adaptation:
  target_fid_bound: 0.02
  max_iter: 5

# Evaluation settings
budgets:
  server: [80]
