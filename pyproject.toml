[project]
name = "hypervad"
version = "0.1.0"
description = "HyperVAD: HYper-dimensional, Predictive, Energy-aware Variance-Optimal Diffusion"
authors = [{ name = "ML Researcher", email = "researcher@example.com" }]
requires-python = ">=3.9"

# The ordering of dependencies can be important for some packages.
# Ensure torch is listed before torchvision.
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "pyyaml>=6.0",
    "datasets>=2.14.0",
    "transformers>=4.34.0",
    "huggingface_hub>=0.17.0",
    "lightgbm>=4.1.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "fvcore>=0.1.5"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
